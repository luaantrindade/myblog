<div class="container">
            <h2 class="section-title">Latest Articles</h2>
            <div class="blog-grid" id="blogGrid">
                <!-- Blog cards will be injected here by JS -->
                <div class="blog-placeholder">
                    <p>Loading posts...</p>
                </div>
            </div>
            <a href="/blog.html" class="btn btn-primary">View All Posts →</a>
        </div>
    </section>

    <!-- Contact -->
    <section class="section" id="contact">
        <div class="container">
            <h2 class="section-title">Get In Touch</h2>
            <p class="contact-subtitle">Have a question, collaboration idea, or just want to say hello?</p>
            <form class="contact-form" id="contactForm">
                <div class="form-group">
                    <input type="text" id="name" name="name" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <input type="email" id="email" name="email" placeholder="Your Email" required>
                </div>
                <div class="form-group">
                    <textarea id="message" name="message" placeholder="Your Message" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; <span id="year"></span> Luan Trindade. All rights reserved.</p>
            <div class="footer-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
            </div>
        </div>
    </footer>

    <script>
        // Mobile menu toggle
        const mobileToggle = document.querySelector('.mobile-toggle');
        const navList = document.querySelector('.nav-list');
        mobileToggle.addEventListener('click', () => {
            navList.classList.toggle('active');
            mobileToggle.classList.toggle('open');
        });

        // Set current year
        document.getElementById('year').textContent = new Date().getFullYear();

        // Simple form validation (demo)
        const contactForm = document.getElementById('contactForm');
        contactForm.addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Thanks for your message! (This is a demo – form not connected to backend.)');
            contactForm.reset();
        });

        // Load blog posts from JSON
        async function loadBlogPosts() {
            try {
                const response = await fetch('/posts.json');
                const posts = await response.json();
                const blogGrid = document.getElementById('blogGrid');
                blogGrid.innerHTML = ''; // clear placeholder

                posts.forEach(post => {
                    const card = document.createElement('div');
                    card.className = 'blog-card';
                    card.innerHTML = `
                        <div class="blog-card-img">
                            <img src="${post.image}" alt="${post.title}">
                        </div>
                        <div class="blog-card-content">
                            <h3>${post.title}</h3>
                            <div class="meta">
                                <span>${post.date}</span>
                                <span>${post.readTime}</span>
                            </div>
                            <p>${post.excerpt}</p>
                            <a href="/posts/${post.slug}.html" class="btn btn-sm">Read more →</a>
                        </div>
                    `;
                    blogGrid.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading blog posts:', error);
                document.getElementById('blogGrid').innerHTML = '<p class="error">Failed to load posts.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadBlogPosts);
    </script>
</body>
</html>
