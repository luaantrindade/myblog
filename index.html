<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
    <style>
        body {font-family: Arial, sans-serif; margin:0; padding:0; background:#f9f9f9; color:#333;}
        header {background:#0066cc; color:#fff; padding:1rem; text-align:center;}
        nav {background:#004c99; padding:0.5rem;}
        nav a {color:#fff; margin:0 1rem; text-decoration:none;}
        main {max-width:800px; margin:2rem auto; padding:0 1rem;}
        .post {background:#fff; margin-bottom:2rem; padding:1.5rem; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1);}
        .post h2 {color:#0066cc;}
        .post .meta {font-size:0.9rem; color:#666;}
        footer {text-align:center; padding:1rem; margin-top:2rem; color:#666;}
    </style>
</head>
<body>
    <header>
        <h1>My Blog</h1>
        <p>Sharing thoughts and ideas</p>
    </header>
    <nav>
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
    </nav>
    <main>
        <section class="post">
            <h2>Welcome to My Blog</h2>
            <p class="meta">Posted on September 28, 2026</p>
            <p>This is the first post. You can edit this content or add new posts by modifying the HTML files.</p>
        </section>
    </main>
    <footer>
        &copy; 2026 My Blog. All rights reserved.
    </footer>
</body>
</html>
