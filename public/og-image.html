<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { margin: 0; padding: 0; background: #0a0f1a; }
    svg { display: block; }
  </style>
</head>
<body>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a"/>
      <stop offset="50%" style="stop-color:#1a1f2e"/>
      <stop offset="100%" style="stop-color:#0d1426"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="url(#accentGrad)" stroke-width="0.5" opacity="0.1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <circle cx="150" cy="150" r="120" fill="url(#accentGrad)" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1050" cy="480" r="180" fill="#a855f7" opacity="0.06" filter="url(#glow)"/>
  <circle cx="1100" cy="100" r="80" fill="#ec4899" opacity="0.05" filter="url(#glow)"/>

  <path d="M 60 60 h 80 M 60 60 v 80" stroke="url(#accentGrad)" stroke-width="3" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M 1140 60 h -80 M 1140 60 v 80" stroke="url(#accentGrad)" stroke-width="3" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M 60 570 h 80 M 60 570 v -80" stroke="url(#accentGrad)" stroke-width="3" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M 1140 570 h -80 M 1140 570 v -80" stroke="url(#accentGrad)" stroke-width="3" fill="none" opacity="0.4" stroke-linecap="round"/>

  <text x="600" y="260" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="800" fill="url(#textGrad)" filter="url(#glow)">Luan</text>

  <text x="600" y="355" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#94a3b8" letter-spacing="4">Field Notes on AI, Support & Systems</text>

  <line x1="450" y1="385" x2="750" y2="385" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6"/>

  <text x="600" y="430" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="300" fill="#64748b">Based in Donabate, Ireland</text>

  <text x="600" y="540" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#475569">luantrindade.com</text>
</svg>
</body>
</html>
